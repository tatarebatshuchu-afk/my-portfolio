<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Админ-панель</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .btn-logout { background: #ef4444; }
    .btn-logout:hover { background: #dc2626; }
    #admin-panel { display: none; }
    .error { color: #f87171; margin-top: 12px; font-size: 13px; display: none; }
    a { color: #38bdf8; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Форма входа -->
  <div class="card" id="login-box">
    <h2>Вход в систему</h2>
    <input type="text" id="login" placeholder="Логин" autocomplete="off">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="checkAuth()">Войти</button>
    <div id="error-msg" class="error">Неверный логин или пароль!</div>
    <a href="../">← На главную</a>
  </div>

  <!-- Панель управления -->
  <div class="card" id="admin-panel">
    <h2>Панель управления ⚡</h2>
    <p>Доступ подтвержден. Вы вошли как Администратор.</p>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <script>
    async function hashString(str) {
      const buffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function fetchConfigNoCache() {
      // Добавляем уникальный параметр времени, чтобы обойти кэш браузера и CDN
      const cacheBuster = '?t=' + new Date().getTime();
      const response = await fetch('./config.json' + cacheBuster, {
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache'
        }
      });
      if (!response.ok) throw new Error('Ошибка загрузки');
      return await response.json();
    }

    async function checkAuth() {
      const loginVal = document.getElementById('login').value.trim();
      const passVal = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const config = await fetchConfigNoCache();
        const inputPassHash = await hashString(passVal);

        if (loginVal === config.login && inputPassHash === config.passHash) {
          document.getElementById('login-box').style.display = 'none';
          document.getElementById('admin-panel').style.display = 'block';
          sessionStorage.setItem('isAdmin', 'true');
        } else {
          errorMsg.innerText = "Неверный логин или пароль!";
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = "Ошибка получения конфига со страницы!";
        errorMsg.style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('isAdmin');
      location.reload();
    }

    // Сохранение состояния при перезагрузке внутри сессии браузера
    if (sessionStorage.getItem('isAdmin') === 'true') {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
    }
  </script>
</body>
</html>
