<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Персональная страница 👋</h1>
      <p id="about-text">Загрузка...</p>
    </header>

    <section class="card">
      <h2>Мои интересы и навыки</h2>
      <ul class="skills" id="interests-list"></ul>
    </section>

    <section class="card">
      <h2>Проекты</h2>
      <div id="projects-list"></div>
    </section>

    <footer>
      <a href="./admin/" class="admin-link">Админка</a>
    </footer>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('./data.json?t=' + Date.now());
        const data = await response.json();

        // Заполняем текст
        document.getElementById('about-text').innerText = data.aboutText;

        // Заполняем интересы
        const interestsList = document.getElementById('interests-list');
        interestsList.innerHTML = '';
        data.interests.forEach(item => {
          const li = document.createElement('li');
          li.innerText = item;
          interestsList.appendChild(li);
        });

        // Заполняем проекты
        const projectsList = document.getElementById('projects-list');
        projectsList.innerHTML = '';
        data.projects.forEach(p => {
          const div = document.createElement('div');
          div.className = 'project-item';
          div.innerHTML = `<a href="${p.url}" target="_blank"><strong>${p.name}</strong> ↗</a>`;
          projectsList.appendChild(div);
        });
      } catch (e) {
        console.error("Ошибка загрузки data.json", e);
      }
    }

    loadData();
  </script>
</body>
</html>
